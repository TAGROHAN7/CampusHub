<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - CampusHub</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top,
                    rgba(11, 77, 51, 0.25),
                    transparent 45%
                ),
                #f5f8f3;

            color: #173b2b;
        }

        /* HEADER */

        header {
            background:
                linear-gradient(
                    135deg,
                    #062e1f,
                    #0b4d33,
                    #123f2d
                );

            color: white;
            padding: 20px 45px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            box-shadow:
                0 6px 25px
                rgba(6, 46, 31, 0.25);
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        nav {
            display: flex;
            gap: 24px;
            align-items: center;
        }

        nav a {
            color: #f4f1df;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            transition: 0.3s;
        }

        nav a:hover {
            color: #d4af37;
        }

        /* REGISTER AREA */

        .register-section {
            min-height: calc(100vh - 85px);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 50px 20px;
        }

        /* REGISTER CARD */

        .register-card {
            width: 100%;
            max-width: 450px;

            background: white;

            padding: 42px;

            border-radius: 22px;

            border: 1px solid #dce6dc;

            box-shadow:
                0 20px 50px
                rgba(6, 46, 31, 0.14);

            text-align: center;
        }

        .register-card h1 {
            margin: 0;

            color: #073b28;

            font-size: 34px;
        }

        .subtitle {
            color: #66756d;

            margin: 10px 0 30px;

            font-size: 15px;
        }

        /* INPUTS */

        .register-card input {
            width: 100%;

            padding: 14px 16px;

            margin-bottom: 16px;

            border: 1px solid #d3ded5;

            border-radius: 10px;

            background: #fbfdfb;

            color: #173b2b;

            font-size: 15px;

            outline: none;

            transition: 0.3s;
        }

        .register-card input:focus {
            border-color: #c5a227;

            box-shadow:
                0 0 0 4px
                rgba(197, 162, 39, 0.12);
        }

        /* BUTTON */

        .btn {
            width: 100%;

            padding: 14px;

            margin-top: 8px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #0b4d33,
                    #087044
                );

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 8px 20px
                rgba(8, 112, 68, 0.22);

            transition: 0.3s;
        }

        .btn:hover {
            transform: translateY(-3px);

            background:
                linear-gradient(
                    135deg,
                    #087044,
                    #0b4d33
                );
        }

        /* MESSAGE */

        #message {
            margin-top: 15px;

            font-size: 14px;

            text-align: center;
        }

        /* LOGIN LINK */

        .login-text {
            margin-top: 25px;

            color: #66756d;

            font-size: 14px;
        }

        .login-text a {
            color: #0b4d33;

            text-decoration: none;

            font-weight: bold;
        }

        .login-text a:hover {
            color: #d4af37;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            header {
                padding: 18px 20px;
            }

            .logo {
                font-size: 23px;
            }

            nav {
                gap: 12px;
            }

            nav a {
                font-size: 13px;
            }

            .register-section {
                padding: 30px 15px;
            }

            .register-card {
                padding: 30px 22px;
            }

            .register-card h1 {
                font-size: 28px;
            }
        }

    </style>
