<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - CampusHub</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top,
                    rgba(11, 77, 51, 0.25),
                    transparent 45%
                ),
                #f5f8f3;

            color: #173b2b;
        }

        /* HEADER */

        header {
            background:
                linear-gradient(
                    135deg,
                    #062e1f,
                    #0b4d33,
                    #123f2d
                );

            color: white;
            padding: 20px 45px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            box-shadow:
                0 6px 25px
                rgba(6, 46, 31, 0.25);
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        nav {
            display: flex;
            gap: 24px;
            align-items: center;
        }

        nav a {
            color: #f4f1df;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            transition: 0.3s;
        }

        nav a:hover {
            color: #d4af37;
        }

        /* LOGIN AREA */

        .login-section {
            min-height: calc(100vh - 85px);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 50px 20px;
        }

        /* LOGIN CARD */

        .login-card {
            width: 100%;
            max-width: 430px;

            background: white;

            padding: 42px;

            border-radius: 22px;

            border: 1px solid #dce6dc;

            box-shadow:
                0 20px 50px
                rgba(6, 46, 31, 0.15);
        }

        .login-card h1 {
            margin: 0 0 10px;

            text-align: center;

            color: #062e1f;

            font-size: 30px;
        }

        .login-card p {
            text-align: center;

            color: #6b7c72;

            margin-bottom: 30px;

            font-size: 14px;
        }

        /* FORM */

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;

            margin-bottom: 8px;

            font-size: 14px;

            font-weight: 600;

            color: #173b2b;
        }

        .form-group input {
            width: 100%;

            padding: 14px 15px;

            border: 1px solid #cfdcd2;

            border-radius: 10px;

            font-size: 15px;

            outline: none;

            transition: 0.3s;

            background: #fbfdfb;
        }

        .form-group input:focus {
            border-color: #0b4d33;

            box-shadow:
                0 0 0 3px
                rgba(11, 77, 51, 0.10);
        }

        /* LOGIN BUTTON */

        .login-btn {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #062e1f,
                    #0b4d33
                );

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .login-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 8px 20px
                rgba(6, 46, 31, 0.25);
        }

        /* REGISTER LINK */

        .register-text {
            text-align: center;

            margin-top: 25px;

            font-size: 14px;

            color: #6b7c72;
        }

        .register-text a {
            color: #0b4d33;

            text-decoration: none;

            font-weight: bold;
        }

        .register-text a:hover {
            color: #d4af37;
        }

        /* MESSAGE */

        #message {
            text-align: center;

            margin-top: 15px;

            font-size: 14px;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            header {
                padding: 18px 20px;
            }

            .logo {
                font-size: 23px;
            }

            nav {
                gap: 12px;
            }

            nav a {
                font-size: 13px;
            }

            .login-section {
                padding: 30px 15px;
            }

            .login-card {
                padding: 30px 22px;
            }
        }

    </style>

</head>


<body>

    <!-- HEADER -->

    <header>

        <div class="logo">
            CampusHub
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="register.html">Register</a>
        </nav>

    </header>


    <!-- LOGIN SECTION -->

    <section class="login-section">

        <div class="login-card">

            <h1>Welcome Back</h1>

            <p>
                Login to your CampusHub account
            </p>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-btn"
                >
                    Login
                </button>

            </form>


            <div id="message"></div>


            <div class="register-text">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </div>

        </div>

    </section>


    <!-- JAVASCRIPT -->

    <script src="js/login.js"></script>

</body>

</html>
