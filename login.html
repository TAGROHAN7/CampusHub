<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - CampusHub</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;

            font-family: Arial, sans-serif;

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top,
                    rgba(11, 77, 51, 0.25),
                    transparent 45%
                ),
                #f5f8f3;

            color: #173b2b;
        }


        /* HEADER */

        header {
            background:
                linear-gradient(
                    135deg,
                    #062e1f,
                    #0b4d33,
                    #123f2d
                );

            color: white;

            padding: 20px 45px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            box-shadow:
                0 6px 25px
                rgba(6, 46, 31, 0.25);
        }


        .logo {
            font-size: 28px;

            font-weight: bold;
        }


        nav {
            display: flex;

            gap: 24px;

            align-items: center;
        }


        nav a {
            color: #f4f1df;

            text-decoration: none;

            font-size: 15px;

            font-weight: 600;

            transition: 0.3s;
        }


        nav a:hover {
            color: #d4af37;
        }


        /* LOGIN AREA */

        .login-section {

            min-height: calc(100vh - 85px);

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 50px 20px;
        }


        /* LOGIN CARD */

        .login-card {

            width: 100%;

            max-width: 430px;

            background: white;

            padding: 42px;

            border-radius: 22px;
