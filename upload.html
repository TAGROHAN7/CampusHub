<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Upload Resource - CampusHub</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- HEADER -->

    <header>

        <h2>CampusHub</h2>

        <nav>

            <a href="index.html">Home</a>

            <a href="notes.html">Resources</a>

            <a href="upload.html">Upload</a>

            <a href="login.html">Login</a>

            <a href="register.html">Register</a>

        </nav>

    </header>


    <!-- UPLOAD FORM -->

    <div class="container">

        <h1>Upload Resource</h1>

        <p class="subtitle">
            Share useful study material with fellow students.
        </p>


        <form id="uploadForm">

            <label for="title">
                Resource Title
            </label>

            <input
                type="text"
                id="title"
                placeholder="Enter resource title"
                required
            >


            <label for="subject">
                Subject
            </label>

            <select id="subject" required>

                <option value="">
                    Select Subject
                </option>

                <option value="Java">
                    Java
                </option>

                <option value="Python">
                    Python
                </option>

                <option value="Networking">
                    Networking
                </option>

                <option value="Software Engineering">
                    Software Engineering
                </option>

                <option value="Embedded Systems">
                    Embedded Systems
                </option>

                <option value="Other">
                    Other
                </option>

            </select>


            <label for="description">
                Description
            </label>

            <textarea
                id="description"
                placeholder="Enter a short description"
            ></textarea>


            <label for="file">
                Select File
            </label>

            <input
                type="file"
                id="file"
                required
            >


            <button type="submit">
                Upload Resource
            </button>

        </form>


        <p id="uploadMessage"
           class="message">
        </p>

    </div>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabase.js"></script>

    <script src="js/upload.js"></script>

</body>

</html>
